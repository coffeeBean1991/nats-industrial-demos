server_name: nats-gateway
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# The gateway is the aggregation tier at the IT/OT boundary. Its JetStream
# domain holds PLANT_GATEWAY, which sources PLANT_EDGE from the edge
# domain and buffers it on disk while the uplink to the hub is down.
jetstream {
  store_dir: /data/jetstream
  domain: gateway
}

leafnodes {
  # The edge dials in here.
  listen: 0.0.0.0:7422

  # The gateway dials out to the hub. HUB_LEAF_URL comes from .env, e.g.
  #   nats://host.docker.internal:7424   (everything on one Mac)
  #   nats://<hub-ip>:7422               (hub on its own machine)
  remotes: [
    { url: $HUB_LEAF_URL }
  ]
}
