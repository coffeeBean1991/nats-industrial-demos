# Hub stack ("the cloud"): NATS hub server (JetStream), InfluxDB writer,
# InfluxDB, Grafana and Prometheus for the NATS metrics relayed from all tiers.
# Runs on the Mac. All settings come from .env (copy .env.example).
name: plant-hub

volumes:
  nats-hub-data:
  influxdb-data:
  grafana-data:

services:
  # NATS hub: JetStream domain "hub", accepts the gateway as a leaf node
  nats-hub:
    image: nats:2.10-alpine
    container_name: nats-hub
    command: ["-c", "/etc/nats/hub.conf"]
    ports:
      - "${HUB_NATS_PORT:-4222}:4222"        # clients / nats CLI
      - "${HUB_LEAF_PORT:-7422}:7422"        # leaf node port the gateway dials
      - "${HUB_MONITOR_PORT:-8222}:8222"     # monitoring
    volumes:
      - ./nats/hub.conf:/etc/nats/hub.conf:ro
      - nats-hub-data:/data/jetstream
    restart: unless-stopped

  # Creates the PLANT_HUB stream at startup, then stays up for `nats` CLI use
  nats-box-hub:
    image: natsio/nats-box:latest
    container_name: nats-box-hub
    environment:
      - NATS_URL=nats://nats-hub:4222
    entrypoint: ["/streams/create-stream.sh", "/streams/hub.json"]
    volumes:
      - ./nats/streams:/streams:ro
    depends_on:
      - nats-hub
    restart: on-failure

  # Durable pull consumer on PLANT_HUB -> InfluxDB, acks after each write
  nats-connector:
    build: ./nats-connector
    container_name: nats-connector
    environment:
      - NATS_URL=nats://nats-hub:4222
      - NATS_STREAM=PLANT_HUB
      - NATS_CONSUMER=influxdb-writer
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_MEASUREMENT=levelcontrol
    depends_on:
      - nats-hub
      - influxdb
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/level-control.json
      # used by the provisioned InfluxDB datasource
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
      - prometheus
    restart: unless-stopped

  # Receives NATS metrics by remote write only (relayed by Fluent Bit)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # Exposes nats-hub monitoring as Prometheus metrics (scraped by Fluent Bit)
  nats-exporter-hub:
    image: natsio/prometheus-nats-exporter:latest
    container_name: nats-exporter-hub
    command: ["-varz", "-connz", "-subz", "-leafz", "-jsz=all", "-use_internal_server_name", "http://nats-hub:8222"]
    depends_on:
      - nats-hub
    restart: unless-stopped

  # Receives edge + gateway metrics, adds the hub's, remote-writes to Prometheus
  fluentbit-hub:
    image: fluent/fluent-bit:3.2
    container_name: fluentbit-hub
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    ports:
      - "${HUB_FLUENTBIT_PORT:-24224}:24224"  # forward input the gateway sends to
    volumes:
      - ./fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
    depends_on:
      - nats-exporter-hub
      - prometheus
    restart: unless-stopped
