server_name: nats-hub
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# The hub is the cloud tier, where consumers (the InfluxDB writer) attach.
# Its JetStream domain holds PLANT_HUB, which sources PLANT_GATEWAY from
# the gateway domain.
jetstream {
  store_dir: /data/jetstream
  domain: hub
}

# The gateway dials in here.
leafnodes {
  listen: 0.0.0.0:7422
}
