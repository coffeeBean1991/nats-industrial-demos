server_name: nats-edge
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Edge sits next to the PLC. Its JetStream domain holds PLANT_EDGE, the
# origin stream that captures plant.> and buffers it on disk while the
# uplink to the gateway is down.
jetstream {
  store_dir: /data/jetstream
  domain: edge
}

# The edge dials out to the gateway and joins it as a leaf node.
# GATEWAY_LEAF_URL comes from the environment (.env), e.g.
#   nats://host.docker.internal:7423   (everything on one Mac)
#   nats://192.168.20.2:7422           (gateway on its own device)
leafnodes {
  remotes: [
    { url: $GATEWAY_LEAF_URL }
  ]
}
